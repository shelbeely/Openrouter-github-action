name: 'AI GitHub Action'
description: 'GitHub Actions powered by the OpenAI Agents SDK'
author: 'Aguirre Ibarra'
branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  action-type:
    description: 'Type of action to perform (pr-review, issue-analyze, code-scan)'
    required: true
  openai-api-key:
    description: 'OpenAI API key'
    required: true
  github-token:
    description: 'GitHub token for API access'
    required: true
  model:
    description: 'OpenAI model to use'
    required: false
    default: 'gpt-4o-mini'
  custom-prompt:
    description: 'Custom system prompt for the AI'
    required: false
  max-turns:
    description: 'Maximum turns for the AI'
    required: false
    default: '30'
  openai-base-url:
    description: 'Custom base URL for OpenAI API'
    required: false
    default: 'https://openrouter.ai/api/v1'
  repo_url:
    description: '(doc-gen only) The URL of the repository to document.'
    required: false
  target_doc_set:
    description: '(doc-gen only) A comma-separated list of the target documentation set to generate.'
    required: false
    default: 'api_ref'
  changelog_agent:
    description: '(doc-gen only) Whether to run the changelog agent.'
    required: false
    default: 'false'


runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    OPENAI_API_KEY: ${{ inputs.openai-api-key }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
    ACTION_TYPE: ${{ inputs.action-type }}
    MODEL: ${{ inputs.model }}
    CUSTOM_PROMPT: ${{ inputs.custom-prompt }}
    MAX_TURNS: ${{ inputs.max-turns }}
    OPENAI_BASE_URL: ${{ inputs.openai-base-url }}
    INPUT_REPO_URL: ${{ inputs.repo_url }}
    INPUT_TARGET_DOC_SET: ${{ inputs.target_doc_set }}
    INPUT_CHANGELOG_AGENT: ${{ inputs.changelog_agent }}